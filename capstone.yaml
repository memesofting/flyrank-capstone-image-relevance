# Capstone manifest
#
# Commands are the real, verified ones for this repository.
# `npm run db:rollback` takes an optional count, e.g. `npm run db:rollback -- 3`.

project:
  name: flyrank-capstone-image-relevance
  title: AI Image Understanding & Content Matching Engine
  track: FlyRank Backend Track
  phase: 2
  phase_status: in_progress
  language: javascript
  runtime: node.js
  license: MIT

# --- run -------------------------------------------------------------------
# The API alone:
run: npm start
# The full local stack (PostgreSQL 17 + pgvector), then migrate, then start:
run_full: |
  docker compose up -d && npm run db:migrate && npm start
base_url: http://localhost:3000

setup:
  install: npm install
  env: cp .env.example .env
  database: docker compose up -d
  migrate: npm run db:migrate

# --- seed ------------------------------------------------------------------
# The image corpus is rebuilt from its manifest rather than from a dump.
# `fetch` is idempotent: on a complete corpus it fetches nothing.
seed: npm run corpus:fetch
seed_verify: npm run corpus:verify
# The verification posts from the Phase 1 smoke test:
seed_smoke: |
  curl -X POST http://localhost:3000/api/posts \
    -H 'content-type: application/json' \
    -d '{"title":"The Behavior of Red Foxes","content":"Red foxes are small omnivorous canids that live in woodland and hunt alone."}'

# --- test ------------------------------------------------------------------
test: npm test
test_integration: npm run test:integration
test_all: npm run test:all

# --- vision pipeline (Phase 2) ---------------------------------------------
# Analyses the whole corpus and embeds every caption. Resumable: a run that
# hits a quota wall parks its jobs and exits, and the next run picks up where
# it left off.
process: npm run process:corpus
# Useful variants:
#   --limit=25                      only the first 25 images
#   --model=gemini-3.1-flash-lite   pin one model for the whole run
#   --no-fallback                   never switch models
#   --no-ingest                     run existing jobs only, skip the corpus scan
#   --model-pool=a,b,c              deliberately span several models (see ADR 004)
process_dry: npm run process:corpus -- --dry-run
costs: npm run costs

# --- evaluation ------------------------------------------------------------
# Phase 4. Not implemented yet; top-1 precision is not yet measured.
eval: npm run eval
eval_status: not_implemented

# --- endpoints -------------------------------------------------------------
# Phase 1 implemented. Phase 2 is worker-side and deliberately exposes no new
# routes yet; visibility is via `npm run process:corpus` and `npm run costs`.
endpoints:
  - GET /health
  - GET /health/ready
  - POST /api/posts
  - GET /api/posts
  - GET /api/posts/:id

# Planned for Phases 3-4, not yet implemented:
endpoints_planned:
  - POST /api/images
  - GET /api/images
  - GET /api/images/:id
  - POST /api/posts/:id/images
  - GET /api/suggestions
  - POST /api/suggestions/:id/review
  - GET /api/jobs/:id
  - GET /api/costs
  - GET /api/evaluation

# --- stack -----------------------------------------------------------------
stack:
  http: express@5
  validation: zod@4
  database: postgresql@17
  vector_extension: pgvector
  images: sharp
  migrations: hand-rolled SQL runner (see docs/adr/001-migration-runner.md)

# --- dataset ---------------------------------------------------------------
dataset:
  manifest: dataset/manifest.json
  schema: dataset/manifest.schema.json
  verified_images: 45
  categories_populated: 6
  unverified_held_aside: 16
  total_size_mib: 11.1
  source: unsplash
  license: Unsplash License

# --- measured results ------------------------------------------------------
# Counted from `npm run test:all`, 2026-10-02.
metrics:
  tests_total: 184
  tests_passing: 184
  unit_tests: 134
  integration_tests: 50
  top1_precision: null   # not measured until Phase 4

# Phase 2 corpus progress. The gate needs 61; the free tier allows roughly 20
# generateContent calls per model per day, so this finished across four models.
# See docs/adr/004-vision-model-availability.md.
vision_corpus:
  images_total: 61
  images_analysed: 57
  images_pending: 4
  analyses_valid: 57
  analyses_low_confidence: 0
  analyses_invalid: 0
  mean_confidence: 0.9796
  min_confidence: 0.9500
  embeddings_persisted: 57
  embedding_dimensions: 768
  vision_models_used:
    - gemini-3.1-flash-lite        # 33 images
    - gemini-3.6-flash              # 15 images
    - gemini-3.7-flash              #  7 images
    - gemini-3.1-flash-lite-preview #  2 images
  embedding_model: gemini-embedding-001
  phase_2_gate: not_met_pending_4_images

